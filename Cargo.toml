[workspace]
members = [
  "crates/kata-dan-cni",
  "crates/backends/host-tap",
  "crates/cni-protocol",
  "crates/dan-core",
  "crates/ovs",
  "crates/providers/fake",
  "crates/providers/kube-ovn",
]
resolver = "2"

[workspace.package]
authors = ["The Kata Containers community <kata-dev@lists.katacontainers.io>"]
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
futures-util = "0.3"
k8s-openapi = { features = ["v1_31"], version = "0.27.1" }
kube = { default-features = false, features = ["ring", "rustls-tls"], version = "3.1.0" }
libc = "0.2.94"
rtnetlink = "0.23.0"
serde = { features = ["derive"], version = "1.0.145" }
serde_json = "1.0.91"
socket2 = "0.6"
tappers = "0.4.2"
tokio = "1.46.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
